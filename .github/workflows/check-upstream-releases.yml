name: Check upstream app releases

on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * *"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: olympus-upstream-updates
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Olympus
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Discover apps and check upstream releases
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/check_updates.py

      - name: Install validation dependencies
        run: python3 -m pip install --disable-pip-version-check "PyYAML==6.0.2"

      - name: Check Python syntax
        run: python3 -m compileall -q .github/scripts

      - name: Validate generated store state
        run: python3 .github/scripts/validate_store.py

      - name: Check whitespace errors
        run: git diff --check

      - name: Prepare update pull request
        id: update-pr
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8
        with:
          branch: automation/upstream-app-updates
          delete-branch: true
          commit-message: "chore: update upstream app releases"
          title: "Update upstream app releases"
          body: |
            Olympus automatically discovered one or more newer upstream releases.

            The updater scans every app package in this store; apps do not need to be
            added to a hard-coded list.

            The generated package state passed Olympus validation before this pull request
            was created. This pull request is automatically merged by the update workflow.
            App installation on Umbrel remains manual, so the user chooses when to install
            the published update.
          labels: automated-update

      - name: Merge validated update pull request
        if: steps.update-pr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr merge "${{ steps.update-pr.outputs.pull-request-number }}" \
            --squash \
            --delete-branch
