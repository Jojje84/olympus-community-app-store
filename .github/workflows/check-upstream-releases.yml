name: Check upstream app releases

on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * *"

permissions:
  contents: write
  pull-requests: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Olympus
        uses: actions/checkout@v4

      - name: Discover apps and check upstream releases
        run: python3 .github/scripts/check_updates.py

      - name: Prepare update pull request
        id: update-pr
        uses: peter-evans/create-pull-request@v7
        with:
          branch: automation/upstream-app-updates
          delete-branch: true
          commit-message: "chore: update upstream app releases"
          title: "Update upstream app releases"
          body: |
            Olympus automatically discovered one or more newer upstream releases.

            The updater scans every app package in this store; apps do not need to be
            added to a hard-coded list.

            This pull request is automatically merged by the Olympus update workflow.
            App installation on Umbrel remains manual, so the user chooses when to
            install the published update.
          labels: automated-update

      - name: Merge update pull request
        if: steps.update-pr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr merge "${{ steps.update-pr.outputs.pull-request-number }}" \
            --squash \
            --delete-branch
