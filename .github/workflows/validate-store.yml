name: Validate Olympus store

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Olympus
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install validation dependencies
        run: python3 -m pip install --disable-pip-version-check "PyYAML==6.0.2"

      - name: Check Python syntax
        run: python3 -m compileall -q .github/scripts

      - name: Validate store packages
        run: python3 .github/scripts/validate_store.py

      - name: Validate ForgeCore runtime sources
        shell: bash
        run: |
          python3 -m py_compile olympus-forgecore/data/bin/dashboard-server.py
          bash -n olympus-forgecore/data/bin/runner-manager.sh
          sh -n olympus-forgecore/data/bin/cleanup-loop.sh
          python3 - <<'PY'
          import base64
          from pathlib import Path

          pairs = (
              ("olympus-forgecore/dashboard-server.b64.template", "olympus-forgecore/data/bin/dashboard-server.py"),
              ("olympus-forgecore/runner-manager.b64.template", "olympus-forgecore/data/bin/runner-manager.sh"),
              ("olympus-forgecore/cleanup-loop.b64.template", "olympus-forgecore/data/bin/cleanup-loop.sh"),
          )
          for template, source in pairs:
              decoded = base64.b64decode(Path(template).read_text().strip())
              actual = Path(source).read_bytes()
              if decoded != actual:
                  raise SystemExit(f"{source} is out of sync with {template}")

          import binascii
          import re
          import struct

          root = Path("olympus-forgecore")
          icon = (root / "icon.svg").read_text(encoding="utf-8")
          fallback_icon = (root / "data/www/icon.svg").read_text(encoding="utf-8")
          if fallback_icon != icon:
              raise SystemExit("ForgeCore fallback icon is not identical to icon.svg")

          match = re.search(r'data:image/png;base64,([^"]+)', icon)
          if not match:
              raise SystemExit("ForgeCore icon is missing its embedded PNG")
          try:
              png = base64.b64decode(match.group(1), validate=True)
          except binascii.Error as exc:
              raise SystemExit(f"ForgeCore logo base64 is invalid: {exc}")
          if png[:8] != b"\x89PNG\r\n\x1a\n":
              raise SystemExit("ForgeCore logo is not a PNG")
          width, height = struct.unpack(">II", png[16:24])
          if (width, height) != (126, 126):
              raise SystemExit(f"Unexpected ForgeCore logo size: {width}x{height}")
          if png != (root / "assets/forgecore-logo.png").read_bytes():
              raise SystemExit("Canonical ForgeCore PNG does not match icon.svg")

          dashboard = (root / "data/bin/dashboard-server.py").read_text(encoding="utf-8")
          dashboard_icon = re.search(r"ICON_SVG = r'''(.*?)'''\n\nHTML =", dashboard, re.S)
          if not dashboard_icon or dashboard_icon.group(1) != icon:
              raise SystemExit("Dashboard ICON_SVG is not identical to icon.svg")
          if 'img-src \'self\' data:' not in dashboard:
              raise SystemExit("ForgeCore dashboard CSP must allow the approved embedded logo data")
          if 'src="./icon.svg"' not in dashboard or 'href="./icon.svg"' not in dashboard:
              raise SystemExit("ForgeCore dashboard logo and favicon must use relative app paths")
          if "⚒" in dashboard or "⚒" in (root / "data/www/index.html").read_text(encoding="utf-8"):
              raise SystemExit("Legacy ForgeCore emoji logo is still present")
          if not (root / "SOURCE_COMMIT").is_file():
              raise SystemExit("ForgeCore distribution package is missing SOURCE_COMMIT provenance")
          PY

      - name: Test ForgeCore clean runner engine
        shell: bash
        run: |
          bash olympus-forgecore/tests/runtime/runner-lifecycle.sh
          bash olympus-forgecore/tests/runtime/runner-watchdog.sh
          bash olympus-forgecore/tests/runtime/runner-layout-standard.sh
          bash olympus-forgecore/tests/runtime/runner-hooks.sh
          bash olympus-forgecore/tests/runtime/runner-repair-guard.sh

      - name: Test ForgeCore degraded manager startup
        shell: bash
        run: bash olympus-forgecore/tests/runtime/manager-degraded-startup.sh

      - name: Boot ForgeCore runner container
        shell: bash
        run: bash olympus-forgecore/tests/runtime/runner-container-boot.sh

      - name: Check whitespace errors
        run: git diff --check
