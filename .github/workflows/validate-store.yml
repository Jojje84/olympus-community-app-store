name: Validate Olympus store

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Olympus
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install validation dependencies
        run: python3 -m pip install --disable-pip-version-check "PyYAML==6.0.2"

      - name: Check Python syntax
        run: python3 -m compileall -q .github/scripts

      - name: Validate store packages
        run: python3 .github/scripts/validate_store.py

      - name: Check whitespace errors
        run: git diff --check
