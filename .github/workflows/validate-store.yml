name: Validate Olympus store

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Olympus
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install validation dependencies
        run: python3 -m pip install --disable-pip-version-check "PyYAML==6.0.2"

      - name: Check Python syntax
        run: python3 -m compileall -q .github/scripts

      - name: Validate store packages
        run: python3 .github/scripts/validate_store.py

      - name: Validate ForgeCore runtime sources
        shell: bash
        run: |
          python3 -m py_compile olympus-forgecore/data/bin/dashboard-server.py
          bash -n olympus-forgecore/data/bin/runner-manager.sh
          sh -n olympus-forgecore/data/bin/cleanup-loop.sh
          python3 - <<'PY'
          import base64
          from pathlib import Path

          pairs = (
              ("olympus-forgecore/dashboard-server.b64.template", "olympus-forgecore/data/bin/dashboard-server.py"),
              ("olympus-forgecore/runner-manager.b64.template", "olympus-forgecore/data/bin/runner-manager.sh"),
              ("olympus-forgecore/cleanup-loop.b64.template", "olympus-forgecore/data/bin/cleanup-loop.sh"),
          )
          for template, source in pairs:
              decoded = base64.b64decode(Path(template).read_text().strip())
              actual = Path(source).read_bytes()
              if decoded != actual:
                  raise SystemExit(f"{source} is out of sync with {template}")

          import binascii
          import re
          import struct

          root = Path("olympus-forgecore")
          icon = (root / "icon.svg").read_text(encoding="utf-8")
          fallback_icon = (root / "data/www/icon.svg").read_text(encoding="utf-8")
          if fallback_icon != icon:
              raise SystemExit("ForgeCore fallback icon is not identical to icon.svg")

          match = re.search(r'data:image/png;base64,([^"]+)', icon)
          if not match:
              raise SystemExit("ForgeCore icon is missing its embedded PNG")
          try:
              png = base64.b64decode(match.group(1), validate=True)
          except binascii.Error as exc:
              raise SystemExit(f"ForgeCore logo base64 is invalid: {exc}")
          if png[:8] != b"\x89PNG\r\n\x1a\n":
              raise SystemExit("ForgeCore logo is not a PNG")
          width, height = struct.unpack(">II", png[16:24])
          if (width, height) != (126, 126):
              raise SystemExit(f"Unexpected ForgeCore logo size: {width}x{height}")
          if png != (root / "assets/forgecore-logo.png").read_bytes():
              raise SystemExit("Canonical ForgeCore PNG does not match icon.svg")

          dashboard = (root / "data/bin/dashboard-server.py").read_text(encoding="utf-8")
          dashboard_icon = re.search(r"ICON_SVG = r'''(.*?)'''\n\nHTML =", dashboard, re.S)
          if not dashboard_icon or dashboard_icon.group(1) != icon:
              raise SystemExit("Dashboard ICON_SVG is not identical to icon.svg")
          if 'img-src \'self\' data:' not in dashboard:
              raise SystemExit("ForgeCore dashboard CSP must allow the approved embedded logo data")
          if 'src="./icon.svg"' not in dashboard or 'href="./icon.svg"' not in dashboard:
              raise SystemExit("ForgeCore dashboard logo and favicon must use relative app paths")
          if "⚒" in dashboard or "⚒" in (root / "data/www/index.html").read_text(encoding="utf-8"):
              raise SystemExit("Legacy ForgeCore emoji logo is still present")
          if not (root / "SOURCE_COMMIT").is_file():
              raise SystemExit("ForgeCore distribution package is missing SOURCE_COMMIT provenance")
          PY

      - name: Validate ForgeCore Umbrel storage resolution
        shell: bash
        run: bash olympus-forgecore/tests/runtime/umbrel-storage-resolution.sh

      - name: Validate ForgeCore storage resolution inside Umbrel update contract
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          umbrel_root="$tmp/umbrel"
          app_dir="$umbrel_root/app-data/olympus-forgecore"
          storage="$umbrel_root/external/HDD/ForgeCore"

          mkdir -p "$app_dir/data/state" "$storage"
          touch "$storage/.forgecore-external"

          # Umbrel's app-script sources exports.sh before Compose evaluation on
          # start/update. Simulate the same environment contract here.
          export UMBREL_ROOT="$umbrel_root"
          export EXPORTS_APP_DIR="$app_dir"
          export EXPORTS_APP_DATA_DIR="$app_dir/data"
          unset FORGECORE_STORAGE_ROOT FORGECORE_STORAGE_RESOLUTION || true
          source olympus-forgecore/exports.sh

          test "$FORGECORE_STORAGE_ROOT" = "$storage"
          test "$FORGECORE_STORAGE_RESOLUTION" = "external-discovery"

          export APP_DATA_DIR="$app_dir"
          docker compose -f olympus-forgecore/docker-compose.yml config --format json > "$tmp/compose.json"
          python3 - "$tmp/compose.json" "$storage" <<'PY'
          import json
          import sys
          from pathlib import Path

          compose = json.loads(Path(sys.argv[1]).read_text())
          expected = sys.argv[2]
          mounts = []
          for name, service in compose.get("services", {}).items():
              for volume in service.get("volumes", []) or []:
                  if isinstance(volume, dict) and volume.get("target") == "/forgecore/storage":
                      mounts.append((name, volume.get("source")))
          if len(mounts) < 4:
              raise SystemExit(f"missing ForgeCore storage mounts: {mounts!r}")
          wrong = [(name, source) for name, source in mounts if source != expected]
          if wrong:
              raise SystemExit(f"storage binds do not use resolved external path: {wrong!r}")
          PY
          grep -Fq '"FORGECORE_STORAGE_RESOLUTION": "external-discovery"' "$tmp/compose.json"

          # Simulate an app update replacing docker-compose.yml. Because the
          # host path is now owned by exports.sh/app data, resolving again must
          # still return the same external directory without any manual edit.
          unset FORGECORE_STORAGE_ROOT FORGECORE_STORAGE_RESOLUTION || true
          source olympus-forgecore/exports.sh
          test "$FORGECORE_STORAGE_ROOT" = "$storage"
          test "$FORGECORE_STORAGE_RESOLUTION" = "saved"

      - name: Validate candidate dashboard/runtime template sync
        shell: bash
        run: |
          python3 - <<'PY'
          import base64
          from pathlib import Path
          src = Path("olympus-forgecore/data/bin/dashboard-server.py").read_bytes()
          tpl = base64.b64decode(Path("olympus-forgecore/dashboard-server.b64.template").read_text().strip())
          if src != tpl:
              raise SystemExit("dashboard template is out of sync")
          PY

      - name: Check whitespace errors
        run: git diff --check
