version: "3.8"

services:
  app_proxy:
    container_name: lyftr-proxy
    environment:
      APP_HOST: lyftr-web
      APP_PORT: 80
      PROXY_AUTH_WHITELIST: "/api/*"

  backend:
    container_name: lyftr-backend
    image: cwlumm/lyftr-backend:v0.1.0-beta.6
    restart: on-failure
    volumes:
      - ${APP_DATA_DIR}/data:/app/data
    environment:
      ENV: production
      PORT: 3000
      JWT_SECRET: ${APP_LYFTR_JWT_SECRET}
      CORS_ORIGIN: "http://${DEVICE_DOMAIN_NAME}:8797"
      DB_TYPE: sqlite
      DB_PATH: /app/data/lyftr.db
      REGISTRATION: first-user
      DEMO_MODE: "false"
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    container_name: lyftr-web
    image: cwlumm/lyftr-frontend:v0.1.0-beta.6
    restart: on-failure
    environment:
      BACKEND_ORIGIN: backend:3000
    depends_on:
      backend:
        condition: service_healthy