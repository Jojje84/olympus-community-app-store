manifestVersion: 1
id: olympus-crafty
category: developer
name: Crafty Controller
version: "4.11.0"
tagline: Manage Minecraft servers from a web dashboard
icon: https://raw.githubusercontent.com/dennysubke/dennys-umbrel-app-gallery/main/denny-crafty/logo.png
description: >-
  Crafty Controller is a self-hosted web interface for creating, running,
  monitoring and managing Minecraft servers.


  ⚠️ Crafty serves its dashboard over HTTPS with a self-signed certificate.
  Your browser may show a certificate warning the first time you open it.


  ⚠️ If Crafty is already installed from another Umbrel Community App Store,
  do not install this Olympus package alongside it. The Minecraft and Bedrock
  port ranges can conflict. Keep your existing installation until you decide
  whether you want to migrate.


  The first-run admin credentials are generated by Crafty and stored inside
  the persistent config directory in default-creds.txt.
releaseNotes: >-
  Packaged from upstream Crafty Controller v4.11.0.

developer: Arcadia Technology
website: https://craftycontrol.com/
dependencies: []
repo: https://gitlab.com/crafty-controller/crafty-4
support: https://gitlab.com/crafty-controller/crafty-4/-/issues

port: 18444
gallery: []
path: "https://umbrel.local:18444"

defaultUsername: "admin"
defaultPassword: ""

submitter: Jojje84
submission: https://github.com/Jojje84/zeus-community-app-store