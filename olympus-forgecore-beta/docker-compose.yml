version: "3.7"

services:
  docker:
    image: docker:29.8.1-dind
    restart: unless-stopped
    privileged: true
    environment:
      DOCKER_TLS_CERTDIR: ""
    command:
      - dockerd
      - --host=tcp://0.0.0.0:2375
      - --host=unix:///var/run/docker.sock
      - --data-root=/storage/docker
      - --log-level=warn
    volumes:
      - ${APP_DATA_DIR}/storage:/storage
    healthcheck:
      test: ["CMD", "docker", "-H", "tcp://127.0.0.1:2375", "info"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  runner:
    image: ghcr.io/actions/actions-runner:2.337.0
    restart: unless-stopped
    init: true
    depends_on:
      - docker
    environment:
      FORGECORE_APP_ROOT: /data
      FORGECORE_STORAGE_ROOT: /storage
      DOCKER_HOST: tcp://docker:2375
    volumes:
      - ${APP_DATA_DIR}/data:/data
      - ${APP_DATA_DIR}/storage:/storage
      - ${APP_DATA_DIR}/forgecore-runner.b64:/runtime/forgecore-runner.b64:ro
    entrypoint:
      - /bin/bash
      - -lc
      - >-
        set -euo pipefail;
        sudo mkdir -p /data/state/runner-requests /data/state/runner-resets /data/state/runner-restarts /data/state/runner-starts /data/state/runner-stops /storage/runners /storage/logs;
        sudo chown -R runner:docker /data /storage/runners /storage/logs;
        command -v jq >/dev/null || { echo "ForgeCore Runner image is missing jq"; exit 1; };
        test -r /runtime/forgecore-runner.b64 || { echo "ForgeCore Runner artifact is missing"; exit 1; };
        base64 -d /runtime/forgecore-runner.b64 > /tmp/forgecore-runner-manager.sh;
        grep -Fq 'FORGECORE_RUNNER_BUILD="0.1.0-beta.9"' /tmp/forgecore-runner-manager.sh
        || { echo "ForgeCore Runner artifact build mismatch"; exit 1; };
        /bin/bash -n /tmp/forgecore-runner-manager.sh;
        chmod 700 /tmp/forgecore-runner-manager.sh;
        exec /bin/bash /tmp/forgecore-runner-manager.sh

  web:
    image: python:3.13-alpine
    restart: unless-stopped
    environment:
      FORGECORE_APP_ROOT: /data
      FORGECORE_STORAGE_ROOT: /storage
      FORGECORE_INDEX_FILE: /tmp/forgecore-index.html
      PORT: "8080"
    volumes:
      - ${APP_DATA_DIR}/data:/data
      - ${APP_DATA_DIR}/storage:/storage
      - ${APP_DATA_DIR}/forgecore-server.b64:/runtime/forgecore-server.b64:ro
      - ${APP_DATA_DIR}/forgecore-dashboard.b64:/runtime/forgecore-dashboard.b64:ro
    entrypoint:
      - /bin/sh
      - -c
      - >-
        set -eu;
        test -r /runtime/forgecore-server.b64 || { echo "ForgeCore server artifact is missing"; exit 1; };
        test -r /runtime/forgecore-dashboard.b64 || { echo "ForgeCore dashboard artifact is missing"; exit 1; };
        base64 -d /runtime/forgecore-server.b64 > /tmp/forgecore-server.py;
        base64 -d /runtime/forgecore-dashboard.b64 > /tmp/forgecore-index.html;
        grep -Fq 'VERSION = "0.1.0-beta.9"' /tmp/forgecore-server.py
        || { echo "ForgeCore server artifact build mismatch"; exit 1; };
        grep -Fq 'Clean Beta · beta.9' /tmp/forgecore-index.html
        || { echo "ForgeCore dashboard artifact build mismatch"; exit 1; };
        python3 -m py_compile /tmp/forgecore-server.py;
        exec python3 /tmp/forgecore-server.py
    ports:
      - "8800:8080"
    healthcheck:
      test: ["CMD", "python3", "-c", "import json, urllib.request; data=json.load(urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=2)); assert data.get('version') == '0.1.0-beta.9'"]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 5s
