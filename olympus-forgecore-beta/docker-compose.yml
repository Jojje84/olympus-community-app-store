version: "3.7"

services:
  docker:
    image: docker:29.8.1-dind
    restart: unless-stopped
    privileged: true
    environment:
      DOCKER_TLS_CERTDIR: ""
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        test -f /forgecore/storage/.forgecore-external
        || { echo "ForgeCore external storage marker missing"; exit 1; };
        exec dockerd
        --host=tcp://0.0.0.0:2375
        --host=unix:///var/run/docker.sock
        --data-root=/forgecore/storage/docker
        --log-level=warn
    volumes:
      - ${FORGECORE_STORAGE_ROOT:-/mnt/forgecore-beta}:/forgecore/storage
    healthcheck:
      test: ["CMD", "docker", "-H", "tcp://127.0.0.1:2375", "info"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  build-docker:
    image: docker:29.8.1-dind
    restart: unless-stopped
    privileged: true
    environment:
      DOCKER_TLS_CERTDIR: ""
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        test -f /forgecore/storage/.forgecore-external
        || { echo "ForgeCore external storage marker missing"; exit 1; };
        exec dockerd
        --host=tcp://0.0.0.0:2375
        --data-root=/forgecore/storage/build-runtime/docker
        --log-level=warn
    volumes:
      - ${FORGECORE_STORAGE_ROOT:-/mnt/forgecore-beta}:/forgecore/storage
    healthcheck:
      test: ["CMD", "docker", "-H", "tcp://127.0.0.1:2375", "info"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  runner:
    image: ghcr.io/actions/actions-runner:2.337.0
    restart: unless-stopped
    init: true
    environment:
      DOCKER_HOST: tcp://docker:2375
      DOCKER_CONFIG: /forgecore/storage/cache/docker-config
      FORGECORE_APP_ROOT: /forgecore/app
      FORGECORE_STORAGE_ROOT: /forgecore/storage
      FORGECORE_STORAGE_HOST_PATH: ${FORGECORE_STORAGE_ROOT}
      FORGECORE_STORAGE_RESOLUTION: ${FORGECORE_STORAGE_RESOLUTION:-unknown}
      FORGECORE_RUNTIME_VERSION: "0.1.0-beta.65"
      GOCACHE: /forgecore/storage/cache/go-build
      GOMODCACHE: /forgecore/storage/cache/go-mod
      NPM_CONFIG_CACHE: /forgecore/storage/cache/npm
      PLAYWRIGHT_BROWSERS_PATH: /forgecore/storage/cache/playwright
      RUNNER_TOOL_CACHE: /forgecore/storage/cache/toolcache
    volumes:
      - ${FORGECORE_STORAGE_ROOT:-/mnt/forgecore-beta}:/forgecore/storage
      - ${APP_DATA_DIR}/data:/forgecore/app
      - ${APP_DATA_DIR}/runner-manager.b64:/forgecore/runtime/runner-manager.b64:ro
    entrypoint:
      - /bin/bash
      - -lc
      - >-
        set -u;
        echo "[bootstrap] ForgeCore beta65 pre-manager bootstrap entered";
        sudo mkdir -p /forgecore/app/state/runner-requests /forgecore/app/config/apps /forgecore/app/config/publish-presets;
        sudo chown -R runner:docker /forgecore/app;
        sudo mkdir -p /forgecore/storage/logs /forgecore/storage/runners /forgecore/storage/workspaces /forgecore/storage/cache /forgecore/storage/artifacts /forgecore/storage/runner-backups;
        sudo chown -R runner:docker /forgecore/storage/logs /forgecore/storage/runners /forgecore/storage/workspaces /forgecore/storage/cache /forgecore/storage/artifacts /forgecore/storage/runner-backups;
        exec >> /forgecore/app/state/runner-bootstrap.log 2>&1;
        echo "$(date -u +%Y-%m-%dT%H:%M:%SZ) [bootstrap] ForgeCore 0.1.0-beta.65 runner bootstrap started";
        id;
        if ! test -f /forgecore/storage/.forgecore-external; then
          printf '%s\n' "ForgeCore external storage is not mounted at the resolved host path. Update/storage binding must be repaired before the runner can start." > /forgecore/app/state/runner-service.error;
          echo "[bootstrap] external storage marker missing";
          exit 1;
        fi;
        if ! test -r /forgecore/runtime/runner-manager.b64 || test -d /forgecore/runtime/runner-manager.b64; then
          printf '%s\n' "Runner runtime artifact is missing or unreadable." > /forgecore/app/state/runner-service.error;
          echo "[bootstrap] runner-manager.b64 missing or unreadable";
          ls -ld /forgecore/runtime /forgecore/runtime/runner-manager.b64 2>/dev/null || true;
          exit 1;
        fi;
        if ! base64 -d /forgecore/runtime/runner-manager.b64 > /tmp/runner-manager.sh; then
          printf '%s\n' "Runner runtime artifact could not be decoded." > /forgecore/app/state/runner-service.error;
          echo "[bootstrap] base64 decode failed";
          exit 1;
        fi;
        if ! grep -Fq 'FORGECORE_MANAGER_BUILD="0.1.0-beta.65"' /tmp/runner-manager.sh; then
          printf '%s\n' "Runner runtime build does not match ForgeCore beta65." > /forgecore/app/state/runner-service.error;
          echo "[bootstrap] decoded manager build mismatch";
          grep -m1 'FORGECORE_MANAGER_BUILD=' /tmp/runner-manager.sh || true;
          exit 1;
        fi;
        if ! /bin/bash -n /tmp/runner-manager.sh; then
          printf '%s\n' "Runner runtime script failed syntax validation." > /forgecore/app/state/runner-service.error;
          echo "[bootstrap] manager syntax validation failed";
          exit 1;
        fi;
        rm -f /forgecore/app/state/runner-service.error;
        chmod 700 /tmp/runner-manager.sh;
        echo "$(date -u +%Y-%m-%dT%H:%M:%SZ) [bootstrap] manager artifact verified; launching";
        exec /bin/bash /tmp/runner-manager.sh
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          test -f /forgecore/app/state/status.json
          && now=$(date +%s)
          && last=$(jq -r '.status_epoch // 0' /forgecore/app/state/status.json)
          && test $((now-last)) -lt 20
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s


  native:
    image: python:3.13
    depends_on:
      - build-docker
    restart: unless-stopped
    init: true
    environment:
      FORGECORE_APP_ROOT: /forgecore/app
      FORGECORE_STORAGE_ROOT: /forgecore/storage
      FORGECORE_RUNTIME_VERSION: "0.1.0-beta.65"
      FORGECORE_NATIVE_POLL_SECONDS: "2"
      FORGECORE_NATIVE_DEFAULT_TIMEOUT_SECONDS: "1800"
      FORGECORE_BUILD_DOCKER_HOST: "http://build-docker:2375"
      FORGECORE_BUILD_DOCKER_API_TIMEOUT_SECONDS: "30"
      FORGECORE_GITHUB_TOKEN: ${FORGECORE_GITHUB_TOKEN:-}
      FORGECORE_SOURCE_TOKEN: ${FORGECORE_SOURCE_TOKEN:-}
      FORGECORE_RELEASE_TOKEN: ${FORGECORE_RELEASE_TOKEN:-}
      FORGECORE_COMMUNITY_STORE_TOKEN: ${FORGECORE_COMMUNITY_STORE_TOKEN:-}
      FORGECORE_COSIGN_PRIVATE_KEY_B64: ${FORGECORE_COSIGN_PRIVATE_KEY_B64:-}
      FORGECORE_COSIGN_PUBLIC_KEY_B64: ${FORGECORE_COSIGN_PUBLIC_KEY_B64:-}
      FORGECORE_COSIGN_PASSWORD: ${FORGECORE_COSIGN_PASSWORD:-}
    volumes:
      - ${FORGECORE_STORAGE_ROOT:-/mnt/forgecore-beta}:/forgecore/storage
      - ${APP_DATA_DIR}/data:/forgecore/app
      - ${APP_DATA_DIR}/native-worker.b64:/forgecore/runtime/native-worker.b64:ro
      - ${APP_DATA_DIR}/isolated-runtime.b64:/forgecore/runtime/isolated-runtime.b64:ro
      - ${APP_DATA_DIR}/dashboard-server.b64:/forgecore/runtime/dashboard-server.b64:ro
    entrypoint:
      - /bin/sh
      - -c
      - >-
        test -f /forgecore/storage/.forgecore-external
        || { echo "ForgeCore external storage marker missing"; exit 1; };
        command -v git >/dev/null
        || { echo "ForgeCore native executor image is missing git"; exit 1; };
        base64 -d /forgecore/runtime/native-worker.b64 > /tmp/native-worker.py;
        base64 -d /forgecore/runtime/isolated-runtime.b64 > /tmp/isolated-runtime.py;
        base64 -d /forgecore/runtime/dashboard-server.b64 > /tmp/dashboard-server.py;
        python3 -m py_compile /tmp/native-worker.py /tmp/isolated-runtime.py /tmp/dashboard-server.py;
        FORGECORE_ISOLATED_RUNTIME_MODULE=/tmp/isolated-runtime.py exec python3 /tmp/native-worker.py

  cleanup:
    image: docker:29.8.1-cli
    restart: unless-stopped
    depends_on:
      - docker
    environment:
      DOCKER_HOST: tcp://docker:2375
      FORGECORE_APP_ROOT: /forgecore/app
      FORGECORE_STORAGE_ROOT: /forgecore/storage
      FORGECORE_STORAGE_HOST_PATH: ${FORGECORE_STORAGE_ROOT}
      FORGECORE_STORAGE_RESOLUTION: ${FORGECORE_STORAGE_RESOLUTION:-unknown}
      FORGECORE_RUNTIME_VERSION: "0.1.0-beta.65"
    volumes:
      - ${FORGECORE_STORAGE_ROOT:-/mnt/forgecore-beta}:/forgecore/storage
      - ${APP_DATA_DIR}/data:/forgecore/app
      - ${APP_DATA_DIR}/cleanup-loop.b64:/forgecore/runtime/cleanup-loop.b64:ro
    entrypoint:
      - /bin/sh
      - -c
      - >-
        test -f /forgecore/storage/.forgecore-external
        || { echo "ForgeCore external storage marker missing"; exit 1; };
        base64 -d /forgecore/runtime/cleanup-loop.b64 > /tmp/cleanup-loop.sh;
        chmod 700 /tmp/cleanup-loop.sh;
        exec /bin/sh /tmp/cleanup-loop.sh

  web:
    image: python:3.13-alpine
    restart: unless-stopped
    environment:
      FORGECORE_APP_ROOT: /forgecore/app
      FORGECORE_STORAGE_ROOT: /forgecore/storage
      FORGECORE_STORAGE_DISPLAY: ${FORGECORE_STORAGE_ROOT:-/mnt/forgecore-beta}
      FORGECORE_STORAGE_HOST_PATH: ${FORGECORE_STORAGE_ROOT:-/mnt/forgecore-beta}
      FORGECORE_STORAGE_RESOLUTION: ${FORGECORE_STORAGE_RESOLUTION:-unknown}
      FORGECORE_RUNTIME_VERSION: "0.1.0-beta.65"
      FORGECORE_DASHBOARD_B64: /forgecore/runtime/dashboard-v2.b64
      FORGECORE_GITHUB_CLIENT_ID: ${FORGECORE_GITHUB_CLIENT_ID:-}
    volumes:
      - ${APP_DATA_DIR}/data:/forgecore/app
      - ${FORGECORE_STORAGE_ROOT:-/mnt/forgecore-beta}:/forgecore/storage:ro
      - ${APP_DATA_DIR}/dashboard-server.b64:/forgecore/runtime/dashboard-server.b64:ro
      - ${APP_DATA_DIR}/dashboard-v2.b64:/forgecore/runtime/dashboard-v2.b64:ro
      - ${APP_DATA_DIR}/runner-manager.b64:/forgecore/inspect/runner-manager.b64:ro
    entrypoint:
      - /bin/sh
      - -c
      - >-
        base64 -d /forgecore/runtime/dashboard-server.b64 > /tmp/dashboard-server.py;
        exec python3 /tmp/dashboard-server.py
    ports:
      - "8800:8080"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=2).read()"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 5s
