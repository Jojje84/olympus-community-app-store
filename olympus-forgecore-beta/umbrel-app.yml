id: olympus-forgecore-beta
category: developer
name: ForgeCore Beta
version: "0.1.0-beta.5"
tagline: GitHub-first build control plane
icon: https://raw.githubusercontent.com/Jojje84/olympus-community-app-store/main/olympus-forgecore-beta/icon.svg?v=clean-beta-5
description: >-
  A clean ForgeCore beta rebuilt from a new GitHub-first foundation. Connect GitHub,
  import repositories and self-hosted runner state, and optionally attach a local
  ForgeCore Runner. The runtime is Runner-first; only a one-time Beta 4 layout migration is kept to preserve existing managed runners.
releaseNotes: >-
  Clean Beta 5 makes ForgeCore feel immediate on launch. The dashboard now restores the latest
  cached repository and runner state first, opens without waiting for every GitHub request, and
  refreshes repositories and runner inventories progressively in the background. Each repository
  shows its own syncing state while fresh data arrives. The local runtime is now Runner-first
  throughout: Runner service, Runner API, Runner manager, Runner storage, Runner state and Runner
  logs replace the old Agent naming. A one-time Beta 4 layout migration keeps existing managed
  runners from disappearing during this cleanup.
