category: developer
name: ForgeCore Beta
version: "0.1.0-beta.9"
tagline: GitHub-first build control plane
icon: https://raw.githubusercontent.com/Jojje84/olympus-community-app-store/main/olympus-forgecore-beta/icon.svg?v=clean-beta-9
description: >-
  A clean ForgeCore beta rebuilt from a new GitHub-first foundation. Connect GitHub,
  import repositories and self-hosted runner state, and optionally attach a local
  ForgeCore Runner. The runtime is Runner-first; only a one-time Beta 4 layout migration is kept to preserve existing managed runners.
releaseNotes: >-
  Clean Beta 9 adds the missing GitHub Actions workflow layer. A new CI/Workflows view lists the
  workflow files in every connected repository, shows their runs-on routing, latest run when the
  current GitHub App has Actions read access, and whether an online runner matches the required
  labels. Workflow Details can rename the top-level workflow name directly in GitHub by committing
  the YAML change to the repository default branch. New ForgeCore GitHub Apps request Contents
  read/write plus Actions read; existing apps created before Beta 9 can still list workflows through
  repository contents, but workflow rename may require granting Contents read/write in GitHub App
  permissions once.
