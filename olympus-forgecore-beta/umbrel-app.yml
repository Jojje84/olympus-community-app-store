name: ForgeCore Beta
version: "0.1.0-beta.23"
tagline: Self-hosted GitHub runner control plane
icon: https://raw.githubusercontent.com/Jojje84/olympus-community-app-store/main/olympus-forgecore-beta/icon.svg?v=runner-core-23
description: >-
  ForgeCore Runner Core is a focused self-hosted GitHub Actions runner manager for Umbrel.
  Connect GitHub, choose repositories, create one or more ForgeCore runners, and manage
  runner health, capacity, lifecycle and diagnostics from one mobile-friendly dashboard.
releaseNotes: >-
  Clean Beta 23 makes workflow assignment a first-class runner setting. Create and Edit
  runner now offer Build workflow, Test workflow, Release workflow and Deploy workflow
  assignments instead of exposing role labels as the primary concept. ForgeCore maps
  those assignments to GitHub self-hosted runner labels and shows the active workflow
  assignments directly on each runner card. Edit and Remove are now optimistic in the
  dashboard: accepted edits appear immediately while the runner reconnects, and accepted
  removals disappear from the list immediately while GitHub/local cleanup finishes in
  the background. Pending operations are protected from periodic refresh so old state
  does not flash back into the UI.
