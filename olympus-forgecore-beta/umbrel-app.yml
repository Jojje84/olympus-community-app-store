category: developer
name: ForgeCore Beta
version: "0.1.0-beta.14"
tagline: GitHub-first build control plane
icon: https://raw.githubusercontent.com/Jojje84/olympus-community-app-store/main/olympus-forgecore-beta/icon.svg?v=clean-beta-14
description: >-
  A clean ForgeCore beta rebuilt from a new GitHub-first foundation. Connect GitHub,
  import repositories and self-hosted runner state, and optionally attach a local
  ForgeCore Runner. The runtime is Runner-first; only a one-time Beta 4 layout migration is kept to preserve existing managed runners.
releaseNotes: >-
  Clean Beta 14 focuses on workflow control and diagnostics. Permission checks now
  distinguish Ready, Approval required and Could not verify, and an uncertain status
  no longer blocks rename, routing or delete: ForgeCore tries the real GitHub write
  and reports GitHub's response. Workflow Details now show a routing summary,
  GitHub-hosted minute indicators per job, queued-job/runner-capacity diagnostics,
  clearer display-name semantics and a typed DELETE confirmation. Repository Details
  also show queue and runner capacity. Successful workflow writes are remembered so
  ForgeCore can show when GitHub last accepted a workflow change.
