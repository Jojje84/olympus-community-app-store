tagline: Self-hosted build and release control plane
icon: https://raw.githubusercontent.com/Jojje84/olympus-community-app-store/main/olympus-forgecore-beta/icon.svg?v=0.1.0-beta.56
description: >-
  ForgeCore Beta is a clean first-run build, packaging and release control plane for Umbrel.


  This beta intentionally starts with no imported apps, no preconfigured release or store
  destinations, no connected runner identities and no default ForgeCore account. The first
  launch asks the operator to create an account before ForgeCore data and actions are available.


  Apps use a Source → Build → Delivery workflow. External release repositories, store
  repositories and GitHub runners are connected only when the operator configures them.
  App-specific jobs and releases retain the owning App name and App ID.


  This package is isolated from the existing ForgeCore Community app with a different Umbrel
  app ID, port, app-data directory and external-storage root so both versions can be installed
  and evaluated side by side.
releaseNotes: >-
  Beta 56 removes stale dashboard demo state and obsolete preview behavior, replaces hard-coded
  sample jobs, apps, logs and storage values with live or empty states, keeps the clean first-run
  account model, and aligns the package ID with olympus-forgecore-beta for Community Store updates.

