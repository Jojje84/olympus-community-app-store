name: ForgeCore Beta
version: "0.1.0-beta.6"
tagline: GitHub-first build control plane
icon: https://raw.githubusercontent.com/Jojje84/olympus-community-app-store/main/olympus-forgecore-beta/icon.svg?v=clean-beta-6
description: >-
  A clean ForgeCore beta rebuilt from a new GitHub-first foundation. Connect GitHub,
  import repositories and self-hosted runner state, and optionally attach a local
  ForgeCore Runner. The runtime is Runner-first; only a one-time Beta 4 layout migration is kept to preserve existing managed runners.
releaseNotes: >-
  Clean Beta 6 fixes the delivery and Details flow. Repository Details now opens a repository
  details panel instead of jumping to the Runners page, while Runner Details keeps its own runner
  panel and mobile delegated tap handling. The fast launch path from Beta 5 remains: cached data is
  shown immediately and fresh GitHub repository and runner state is filled in progressively in the
  background. Store provenance and validation metadata are also corrected so this beta can actually
  pass the Olympus store pipeline and become available to Umbrel.
