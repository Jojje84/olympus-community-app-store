category: developer
name: ForgeCore Beta
version: "0.1.0-beta.9"
tagline: GitHub-first build control plane
icon: https://raw.githubusercontent.com/Jojje84/olympus-community-app-store/main/olympus-forgecore-beta/icon.svg?v=clean-beta-9
description: >-
  A clean ForgeCore beta rebuilt from a new GitHub-first foundation. Connect GitHub,
  import repositories and self-hosted runner state, and optionally attach a local
  ForgeCore Runner. The runtime is Runner-first; only a one-time Beta 4 layout migration is kept to preserve existing managed runners.
releaseNotes: >-
  Clean Beta 9 turns runner inventory into a full operations surface. ForgeCore-managed
  runners now support Start, Stop, Restart, Remove and Diagnostics without unnecessary
  re-registration. Unexpected exits are restarted automatically with a restart-loop guard,
  while Runner Details shows uptime, restart history and the current GitHub Actions job when
  available. Possible duplicate registrations and runner failures are collected under Needs
  attention, external runner removal has busy/ownership safety checks, and a ForgeCore Runner
  can now be added even when external runners already exist for the repository.
