version: "0.1.0-beta.20"
tagline: Self-hosted GitHub runner control plane
icon: https://raw.githubusercontent.com/Jojje84/olympus-community-app-store/main/olympus-forgecore-beta/icon.svg?v=runner-core-20
description: >-
  ForgeCore Runner Core is a focused self-hosted GitHub Actions runner manager for Umbrel.
  Connect GitHub, choose repositories, create one or more ForgeCore runners, and manage
  runner health, capacity, lifecycle and diagnostics from one mobile-friendly dashboard.
releaseNotes: >-
  Clean Beta 20 rebuilds ForgeCore around runners only. The Apps and workflow editing
  surfaces are removed from the Clean Beta dashboard. GitHub permissions are reduced to
  metadata read, Actions read and Administration write, eliminating workflow-write and
  pull-request permission dependencies. The new Runner Core dashboard focuses on
  repositories, runner creation, online/busy/offline state, start/stop/restart, rename,
  removal, queue visibility, diagnostics and tester checks. A remote-status watchdog is
  retained for stale runner recovery. Beta 20 uses a dedicated multi-layer Runner Core
  validation suite and must pass real self-hosted execution before publication.
