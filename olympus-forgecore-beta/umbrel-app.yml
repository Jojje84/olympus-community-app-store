manifestVersion: 1
id: olympus-forgecore-beta
category: developer
name: ForgeCore Beta
version: "0.1.0-beta.10"
tagline: GitHub-first build control plane
icon: https://raw.githubusercontent.com/Jojje84/olympus-community-app-store/main/olympus-forgecore-beta/icon.svg?v=clean-beta-10
description: >-
  A clean ForgeCore beta rebuilt from a new GitHub-first foundation. Connect GitHub,
  import repositories and self-hosted runner state, and optionally attach a local
  ForgeCore Runner. The runtime is Runner-first; only a one-time Beta 4 layout migration is kept to preserve existing managed runners.
releaseNotes: >-
  Clean Beta 10 combines the Beta 9 CI/Workflows view with full runner operations.
  ForgeCore-managed runners now support Start, Stop, Restart, Remove and Diagnostics,
  automatic recovery after unexpected exits, restart-loop protection, uptime and restart
  metadata, duplicate-registration attention, and direct cleanup of stale external runner
  registrations. External runners remain visible but cannot be remotely restarted unless
  their machine explicitly runs ForgeCore control software.
