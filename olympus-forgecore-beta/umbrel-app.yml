name: ForgeCore Beta
version: "0.1.0-beta.28"
tagline: Self-hosted GitHub runner control plane
icon: https://raw.githubusercontent.com/Jojje84/olympus-community-app-store/main/olympus-forgecore-beta/icon.svg?v=runner-core-28
description: >-
  ForgeCore is a local-first self-hosted GitHub Actions runner manager for Umbrel.
  Your Beelink owns runner identity, heartbeat, logs and lifecycle. GitHub is used for
  repository access, runner registration and explicit management of the real
  .github/workflows files.
releaseNotes: >-
  Clean Beta 28 makes repository routing explicit and fixes specific-runner selection.
  Runner matching is now case-insensitive and normalized, so a runner cannot disappear
  from Assign runner because of repository-name casing. Assign runner lists the specific
  runners registered to the selected repository first and treats "Any runner registered
  to this repository" as an explicit fallback rather than the default. A new Repositories
  view makes multi-repository setups first-class: each repository shows its local
  ForgeCore runners and provides direct Add runner and Workflows actions. Workflow cards
  now show Repository -> Workflow -> Runner routing and the ForgeCore Node ID so the user
  can see which Beelink-managed runner GitHub Actions is configured to use.
