<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>ForgeCore</title>
  <style>
    :root{color-scheme:dark;--panel:#121923;--panel2:#0f151e;--border:#263142;--text:#f5f7fb;--muted:#9ba8bb;--ok:#45d483;--accent:#f59e0b}
    *{box-sizing:border-box} body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:linear-gradient(180deg,#0b1017 0%,#0c121a 100%);color:var(--text)}
    main{max-width:1100px;margin:0 auto;padding:32px 22px 48px} header{display:flex;align-items:center;gap:16px;margin-bottom:28px}
    .logo{width:64px;height:64px;border-radius:18px;display:grid;place-items:center;background:#111827;border:1px solid var(--border);color:var(--accent);font-size:32px}
    h1{margin:0;font-size:34px;letter-spacing:-.03em} header p{margin:4px 0 0;color:var(--muted)}
    .grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
    .card{background:linear-gradient(180deg,var(--panel),var(--panel2));border:1px solid var(--border);border-radius:18px;padding:20px;min-width:0}
    .label{color:var(--muted);font-size:14px;margin-bottom:10px}.value{font-size:28px;font-weight:700;letter-spacing:-.02em}
    .row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.dot{width:11px;height:11px;border-radius:50%;background:var(--ok);box-shadow:0 0 14px rgba(69,212,131,.45)}.dot.off{background:#7b8798;box-shadow:none}
    .sub{margin-top:8px;color:var(--muted);font-size:14px;overflow-wrap:anywhere}.bar{height:10px;border-radius:999px;background:#202a39;margin-top:14px;overflow:hidden}.bar>span{display:block;height:100%;width:0%;background:var(--ok);transition:width .25s ease}
    footer{margin-top:22px;color:var(--muted);font-size:13px}@media(max-width:720px){main{padding:22px 14px 34px}.grid{grid-template-columns:1fr}h1{font-size:28px}.logo{width:56px;height:56px}}
  </style>
</head>
<body>
  <main>
    <header><div class="logo" aria-hidden="true">⚒</div><div><h1>ForgeCore</h1><p>Simple self-hosted CI for your projects</p></div></header>
    <section class="grid" aria-label="ForgeCore status">
      <article class="card"><div class="label">Runner status</div><div class="row"><span id="runner-dot" class="dot off"></span><div id="runner-status" class="value">Starting…</div></div><div id="runner-name" class="sub">Waiting for runner status</div></article>
      <article class="card"><div class="label">Storage</div><div id="disk-value" class="value">—</div><div class="bar" aria-hidden="true"><span id="disk-bar"></span></div><div id="disk-path" class="sub">External storage</div></article>
      <article class="card"><div class="label">Docker</div><div class="row"><span id="docker-dot" class="dot off"></span><div id="docker-status" class="value">Checking…</div></div><div class="sub">Isolated CI Docker engine</div></article>
      <article class="card"><div class="label">Cleanup</div><div id="cleanup-value" class="value">7 days</div><div id="cleanup-sub" class="sub">Cache max age: 14 days</div></article>
    </section>
    <footer id="updated">ForgeCore status</footer>
  </main>
  <script>
    const setOnline=(id,on)=>document.getElementById(id).classList.toggle('off',!on);
    async function refresh(){try{const res=await fetch('./status.json?ts='+Date.now(),{cache:'no-store'});if(!res.ok)throw new Error('status unavailable');const s=await res.json();document.getElementById('runner-status').textContent=s.runner_online?'Online':'Offline';document.getElementById('runner-name').textContent=s.runner_name||'Runner not configured';setOnline('runner-dot',Boolean(s.runner_online));document.getElementById('docker-status').textContent=s.docker_online?'Running':'Offline';setOnline('docker-dot',Boolean(s.docker_online));const used=Number(s.disk_used_percent||0);document.getElementById('disk-value').textContent=(s.disk_used||'—')+' / '+(s.disk_total||'—');document.getElementById('disk-path').textContent=(s.disk_path||'External storage')+' · '+used+'% used';document.getElementById('disk-bar').style.width=Math.min(100,Math.max(0,used))+'%';document.getElementById('cleanup-value').textContent=(s.cleanup_interval_days||7)+' days';document.getElementById('cleanup-sub').textContent='Cache max age: '+(s.cache_max_age_days||14)+' days';document.getElementById('updated').textContent='Last updated: '+new Date().toLocaleTimeString()}catch(_){document.getElementById('updated').textContent='Waiting for ForgeCore runtime…'}}
    refresh();setInterval(refresh,10000);
  </script>
</body>
</html>
