tagline: Self-hosted CI runner for your projects
icon: https://raw.githubusercontent.com/Jojje84/olympus-community-app-store/main/olympus-forgecore/icon.svg?v=0.1.0-beta.35
description: >-
  ForgeCore is a lightweight self-hosted GitHub Actions platform for Umbrel.
  It runs persistent repository-level runners for multiple trusted repositories,
  including authenticated checkout of private repositories.


  CI jobs use ForgeCore's isolated Docker engine instead of Umbrel's host Docker
  socket. Docker Compose is installed for workflows, while persistent Go build,
  Go module, npm, Playwright, Docker CLI and runner tool caches reduce repeated
  downloads between builds.


  Heavy CI data such as Docker images, runner workspaces, caches, artifacts and
  logs is kept on the configured external ForgeCore storage root. A storage marker
  guard prevents ForgeCore from silently redirecting heavy CI data to the system disk.


  The dashboard is the normal administration surface: it shows runner, Docker,
  Compose and disk health; manages repository runner setup and repair; edits cleanup
  and storage-retention settings; restarts the runner manager; triggers manual cleanup
  with queued, running and completed feedback; shows the next cleanup schedule; and
  exposes persistent ForgeCore logs and recent runtime activity without requiring SSH.


  ForgeCore uses short-lived GitHub runner registration tokens and clears the token
  from its local repository config after registration. Persistent runner credentials
  remain on the external disk, so normal restarts do not require a new token.


  The source tree also includes an optional QEMU/binfmt helper for ARM64/ARMv7
  emulation. It is not enabled automatically by the Umbrel package.
releaseNotes: >-
  Beta 35 fixes the production package/runtime mismatch that allowed Umbrel to
  display a new ForgeCore version while runner-manager, dashboard and cleanup
  could still execute stale persisted .b64 copies from older betas. Compose now
  mounts the versioned packaged .b64.template files directly for every runtime
  component, and the runner service no longer depends on Docker container startup.
  CI now uses the same template filenames as production and fails if Compose ever
  references a runtime file that is not actually shipped in the package.

