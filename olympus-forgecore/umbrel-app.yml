manifestVersion: 1
id: olympus-forgecore
category: developer
name: ForgeCore Beta
version: "0.1.0-beta.10"
tagline: Run GitHub Actions on your own Umbrel hardware
icon: https://raw.githubusercontent.com/Jojje84/olympus-community-app-store/main/olympus-forgecore/icon.svg
description: >-
  ForgeCore is a lightweight self-hosted CI runner for Umbrel. It connects
  trusted GitHub repositories to your own hardware and runs jobs through an
  isolated Docker engine instead of Umbrel's host Docker socket.


  Heavy CI data such as Docker images, build cache, workspaces and artifacts
  is stored on the configured ForgeCore storage root. ForgeCore refuses to
  create a missing storage root automatically, preventing accidental CI data
  from filling the Umbrel system disk.


  The dashboard can add or repair GitHub repository runners, restart runners,
  show per-repository status and trigger cleanup without SSH.
releaseNotes: >-
  Beta 10 redesigns the ForgeCore dashboard with a clearer dark control-center
  layout, larger status cards and more visible runner controls. Repository setup,
  runner repair/restart and cleanup stay available directly in the dashboard,
  while the beta 9 private-repository checkout fix remains in place.

