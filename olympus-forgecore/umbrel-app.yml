manifestVersion: 1
id: olympus-forgecore
category: developer
name: ForgeCore Beta
version: "0.1.0-beta.2"
tagline: Run GitHub Actions on your own Umbrel hardware
icon: https://raw.githubusercontent.com/Jojje84/olympus-community-app-store/main/olympus-forgecore/icon.svg
description: >-
  ForgeCore is a lightweight self-hosted CI runner for Umbrel. It connects
  trusted GitHub repositories to your own hardware and runs jobs through an
  isolated Docker engine instead of Umbrel's host Docker socket.


  Heavy CI data such as Docker images, build cache, workspaces and artifacts
  is stored on the configured ForgeCore storage root. ForgeCore requires a
  storage marker before Docker starts, preventing accidental CI data from
  filling the Umbrel system disk if the external drive is unavailable.


  This beta intentionally keeps the dashboard small: runner status, storage
  usage, Docker status and cleanup settings.
releaseNotes: >-
  Beta 2 binds ForgeCore to the dedicated external HDD path and adds a mount
  guard that prevents the CI Docker engine from starting unless the external
  storage marker is present.

