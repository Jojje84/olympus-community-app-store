icon: https://raw.githubusercontent.com/Jojje84/olympus-community-app-store/main/olympus-forgecore/icon.svg?v=0.1.0-beta.47
description: >-
  ForgeCore is a self-hosted CI/CD, packaging and release control plane for Umbrel.


  Apps own their source repository, executor, build/package configuration and
  publishing policy. Jobs can run through ForgeCore's native isolated build runtime
  or through an App-owned persistent GitHub Actions runner.


  ForgeCore keeps GitHub Actions Docker and native build Docker isolated from each
  other and from Umbrel's host Docker socket. Heavy workspaces, Docker data, caches,
  artifacts, runner identities and logs stay on the configured external ForgeCore
  storage root.


  The dashboard is the normal administration surface for Apps, Jobs, Releases,
  Infrastructure, Settings, Logs and Audit. GitHub runner registration uses
  short-lived tokens; verified persistent runner identity is reused across normal
  restarts.


  ForgeCore can create deterministic Umbrel packages, checksums and signed release
  outputs, publish through Olympus Releases and submit verified stable packages to
  the Olympus Community App Store.


  Older ForgeCore installations are supported through one-time upgrade importers.
  The active runtime and configuration model are v2 only.
releaseNotes: >-
  Beta 47 is the focused Overview review build. Delivery paths now come from each
  App and publish preset, Overview surfaces action-required states instead of
  duplicated infrastructure details, and the manual run dialog uses clearer
  Build, Publish and Build & publish language.

