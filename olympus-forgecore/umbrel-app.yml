name: ForgeCore
version: "0.1.0-beta.54"
tagline: CI/CD and release control plane for Olympus apps
icon: https://raw.githubusercontent.com/Jojje84/olympus-community-app-store/main/olympus-forgecore/icon.svg?v=0.1.0-beta.54
description: >-
  ForgeCore is a self-hosted CI/CD, packaging and release control plane for Umbrel.


  Apps use a Source → Build → Delivery workflow and keep source, build/package and
  delivery choices together. Jobs can run through ForgeCore's native isolated build
  runtime or GitHub Actions, while runner capacity is managed separately.


  ForgeCore keeps GitHub Actions Docker and native build Docker isolated from each
  other and from Umbrel's host Docker socket. Heavy workspaces, Docker data, caches,
  artifacts, runner identities and logs stay on the configured external ForgeCore
  storage root.


  The dashboard is the normal administration surface for Apps, Jobs, Releases,
  Runners & Compute, Infrastructure, Settings, Logs and Audit. GitHub runner
  registration uses short-lived tokens; verified persistent repository runner
  identity is reused across normal restarts.


  ForgeCore can create deterministic Umbrel packages, checksums and signed release
  outputs, publish through Olympus Releases and submit verified stable packages to
  the Olympus Community App Store.


  Older ForgeCore installations are supported through one-time upgrade importers.
  The active runtime and configuration model are v2 only.
releaseNotes: >-
  Beta 54 rebuilds the dashboard around a simpler Source → Build → Delivery model.
  Apps now have one Setup flow, destination repositories use generic user-defined
  names, Runners & Compute is a separate workspace, and advanced delivery policies
  remain available without blocking normal app setup.

