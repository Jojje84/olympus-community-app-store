version: "3.7"

services:
  app_proxy:
    container_name: sparkyfitness-proxy
    environment:
      APP_HOST: sparkyfitness-web
      APP_PORT: 80
      PROXY_AUTH_WHITELIST: "/api/*"

  sparkyfitness-db:
    container_name: sparkyfitness-db
    image: postgres:18.3-alpine
    restart: on-failure
    environment:
      POSTGRES_DB: sparkyfitness_db
      POSTGRES_USER: sparky
      POSTGRES_PASSWORD: ${APP_OLYMPUS_SPARKYFITNESS_DB_PASSWORD}
    volumes:
      - ${APP_DATA_DIR}/data/postgresql:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sparky -d sparkyfitness_db"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  sparkyfitness-server:
    container_name: sparkyfitness-server
    image: codewithcj/sparkyfitness_server:v1.7.2
    restart: on-failure
    depends_on:
      sparkyfitness-db:
        condition: service_healthy
    environment:
      SPARKY_FITNESS_DB_HOST: sparkyfitness-db
      SPARKY_FITNESS_DB_PORT: 5432
      SPARKY_FITNESS_DB_NAME: sparkyfitness_db
      SPARKY_FITNESS_DB_USER: sparky
      SPARKY_FITNESS_DB_PASSWORD: ${APP_OLYMPUS_SPARKYFITNESS_DB_PASSWORD}
      SPARKY_FITNESS_APP_DB_USER: sparky_app
      SPARKY_FITNESS_APP_DB_PASSWORD: ${APP_OLYMPUS_SPARKYFITNESS_APP_DB_PASSWORD}
      SPARKY_FITNESS_FRONTEND_URL: "http://${DEVICE_DOMAIN_NAME}:8798"
      SPARKY_FITNESS_API_ENCRYPTION_KEY: ${APP_OLYMPUS_SPARKYFITNESS_API_ENCRYPTION_KEY}
      BETTER_AUTH_SECRET: ${APP_OLYMPUS_SPARKYFITNESS_AUTH_SECRET}
      SPARKY_FITNESS_FORCE_EMAIL_LOGIN: "true"
      SPARKY_FITNESS_DISABLE_SIGNUP: "false"
      SPARKY_FITNESS_LOG_LEVEL: ERROR
      NODE_ENV: production
      TZ: Europe/Stockholm
    volumes:
      - ${APP_DATA_DIR}/data/backup:/app/SparkyFitnessServer/backup
      - ${APP_DATA_DIR}/data/uploads:/app/SparkyFitnessServer/uploads

  sparkyfitness-frontend:
    container_name: sparkyfitness-web
    image: codewithcj/sparkyfitness:v1.7.2
    restart: on-failure
    depends_on:
      - sparkyfitness-server
    environment:
      SPARKY_FITNESS_FRONTEND_URL: "http://${DEVICE_DOMAIN_NAME}:8798"
      SPARKY_FITNESS_SERVER_HOST: sparkyfitness-server
      SPARKY_FITNESS_SERVER_PORT: 3010